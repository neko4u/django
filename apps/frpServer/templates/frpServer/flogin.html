{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'login/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'captcha/css/slider.css' %}">
    <script src="{% static 'captcha/js/slider.js' %}" defer></script>
</head>
<style>
    /* 密码框右侧的小问号 + hover 提示 */
    .pwd-wrap {
        position: relative;
    }

    .pwd-help {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        line-height: 18px;
        text-align: center;
        border-radius: 50%;
        background: #c7d0dc;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: help;
        user-select: none;
        z-index: 20;
    }

    .pwd-help:hover,
    .pwd-help:focus {
        background: #2b7de9;
    }

    .pwd-help-tip {
        position: absolute;
        right: -4px;
        top: 26px;
        width: 200px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #1a1a2e;
        color: #fff;
        font-size: 12.5px;
        font-weight: 400;
        line-height: 1.6;
        text-align: left;
        white-space: normal;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.15s, visibility 0.15s;
        pointer-events: none;
    }

    .pwd-help:hover .pwd-help-tip,
    .pwd-help:focus .pwd-help-tip {
        opacity: 1;
        visibility: visible;
    }
</style>
<body>
    <div class="login-container">
        <h1 style="user-select: none;">Login</h1>
        <form id="loginForm" method="post" autocomplete="off">
            {% csrf_token %}
            <div>
                <label style="user-select: none;">用户名</label>
                <input type="text" name="user" id="id_user" autocomplete="off">
            </div>
            <div>
                <label style="user-select: none;">密码</label>
                <div class="pwd-wrap">
                    <input type="password" name="pwd" id="id_pwd" autocomplete="off">
                    <span class="pwd-help" tabindex="0" aria-label="密码要求">?<span class="pwd-help-tip">密码要求：8-20位大小写字母和数字组成</span></span>
                </div>
            </div>

            {# 滑块验证通过后由 JS 填入，服务端一次性消费 #}
            <input type="hidden" name="slider_ticket" id="sliderTicket" value="">

            <div id="errorMsg" style="user-select:none;color:red;font-size:15px;min-height:18px;">{% if error %}{{ error }}{% endif %}</div>

            <div>
                <button type="submit" id="loginBtn">登录</button>
            </div>
            <div>
                <a href="{% url 'fregister' %}">注册</a>
                <a href="{% url 'fforgot_password' %}">忘记密码？</a>
            </div>
        </form>
    </div>

    <script>
        (function () {
            'use strict';
    
            var form = document.getElementById('loginForm');
            var btn = document.getElementById('loginBtn');
            var errorBox = document.getElementById('errorMsg');
            var ticketInput = document.getElementById('sliderTicket');
            var submitting = false;
    
            function showError(msg) {
                errorBox.innerText = msg || '';
            }
    
            function done() {
                submitting = false;
                btn.disabled = false;
                btn.innerText = '登录';
            }
    
            function doSubmit() {
                if (submitting) { return; }
                submitting = true;
                btn.disabled = true;
                btn.innerText = '登录中...';
    
                fetch(form.getAttribute('action') || window.location.href, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    credentials: 'same-origin'
                })
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        done();
    
                        if (data.success) {
                            window.location.href = data.redirect_url || '{% url "findex" %}';
                            return;
                        }
    
                        showError(data.error || '登录失败');
    
                        // 服务端判定"本次需要先过滑块"（连续输错达到阈值后），弹出滑块弹窗
                        if (data.need_slider) {
                            if (!window.SliderCaptcha) {
                                showError('验证组件未加载成功，请刷新页面后重试');
                                return;
                            }
                            window.SliderCaptcha.open({
                                onSuccess: function (ticket) {
                                    ticketInput.value = ticket;
                                    showError('');
                                    doSubmit();          // 拿到 ticket 后自动重试登录
                                },
                                onFail: function (msg) {
                                    window.SliderCaptcha.close();
                                    showError(msg || '验证失败，请重新点击登录');
                                }
                            });
                        }
                    })
                    .catch(function () {
                        done();
                        showError('网络错误，请稍后重试');
                    });
            }
    
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                doSubmit();
            });
        }());
    </script>
    
</body>
</html>
