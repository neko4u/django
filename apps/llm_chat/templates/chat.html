{% load static %}
<link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Chat</title>
    <link rel="stylesheet" href="{% static 'llm_chat/css/chat.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
</head>
<body>
    <div class="app-container">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="btn-new-chat">+ 新建对话</button>
            </div>
            <div id="conversation-list" class="conversation-list"></div>
            <div class="sidebar-footer">
                <button id="toggle-sidebar" class="btn-toggle">隐藏</button>
            </div>
        </aside>

        <main class="main-chat">
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <textarea id="user-input" rows="3" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"></textarea>
                <button id="send-btn" class="btn-send">发送</button>
                <button id="stop-btn" class="btn-stop" style="display: none;">停止生成</button>
            </div>
        </main>

        <aside id="params-panel" class="params-panel">
            <div class="panel-header">
                <h3>模型参数</h3>
                <button id="toggle-params" class="btn-toggle" title="隐藏面板">◀</button>
            </div>
            <div class="params-content" id="params-content">
            </div>
        </aside>
    </div>

    <script src="{% static 'llm_chat/js/chat.js' %}"></script>
</body>
</html>
