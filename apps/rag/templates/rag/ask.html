{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星露谷 Wiki 问答</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'rag/css/ask.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<!-- ============ 顶部导航 ============ -->
<header class="topbar">
    <div class="topbar-brand">
        <span class="brand-logo">🌾</span>
        <div class="brand-text">
            <strong>星露谷 Wiki 问答</strong>
            <span class="brand-sub">基于官方中文维基 · <span id="w-mode">检索中</span></span>
        </div>
    </div>
    <nav class="topbar-nav">
        <a href="/index/">首页</a>
        <a href="https://zh.stardewvalleywiki.com/" target="_blank" rel="noopener">原站</a>
    </nav>
</header>

<div class="app-body">

    <!-- ============ 左侧导航 ============ -->
    <aside class="sidebar" id="w-sidebar">
        <div class="sidebar-top">
            <button id="w-new" class="t-btn side-new">+ 新对话</button>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-label">当前</div>
            <div class="side-item active"><span class="side-dot"></span>本次会话</div>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-label">更多</div>
            <div class="side-item placeholder" title="即将上线"><span>历史记录</span><span class="side-tag">待定</span></div>
            <div class="side-item placeholder" title="即将上线"><span>收藏夹</span><span class="side-tag">待定</span></div>
            <div class="side-item placeholder" title="即将上线"><span>热门问题</span><span class="side-tag">待定</span></div>
            <div class="side-item placeholder" title="即将上线"><span>使用说明</span><span class="side-tag">待定</span></div>
        </div>

        <div class="sidebar-foot">
            <span>收录 1,511 页</span>
            <button id="w-toggle-side" class="side-fold" title="折叠侧栏">◀</button>
        </div>
    </aside>

    <!-- ============ 主内容 ============ -->
    <main class="main">
        <div class="thread t-scroll" id="w-thread-wrap">
            <div class="thread-inner">
                <section id="w-empty" class="empty">
                    <h2>问点什么？</h2>
                    <p class="empty-sub">答案全部来自中文维基已抓取的 1,511 个页面，并标注来源</p>
                    <div class="samples">
                        <button class="sample" data-q="防风草多少钱？几天成熟？">防风草多少钱？几天成熟？</button>
                        <button class="sample" data-q="送防风草给谁最划算？">送防风草给谁最划算？</button>
                        <button class="sample" data-q="夏季鱼王在哪钓">夏季鱼王在哪钓</button>
                        <button class="sample" data-q="Joja超市的温室要多少钱？">Joja超市的温室要多少钱？</button>
                        <button class="sample" data-q="求助任务有几种类型？">求助任务有几种类型？</button>
                        <button class="sample" data-q="艾芙琳喜欢什么礼物？">艾芙琳喜欢什么礼物？</button>
                    </div>
                </section>
                <section id="w-thread" class="thread-list"></section>
            </div>
        </div>

        <div class="composer">
            <div class="composer-inner">
                <textarea id="w-input" rows="1" maxlength="200"
                          placeholder="问关于星露谷的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
                <button id="w-send" class="t-btn">发送</button>
            </div>
            <p class="composer-tip">游戏素材版权归 ConcernedApe 所有 · 文字内容来自官方 Wiki（CC BY-NC-SA）</p>
        </div>
    </main>
</div>

<!-- ============ 引用浮层（hover 卡片） ============ -->
<div class="cite-pop" id="w-pop" hidden></div>

<!-- ============ 资料抽屉 ============ -->
<div class="drawer-mask" id="w-mask" hidden></div>
<aside class="drawer" id="w-drawer" hidden>
    <div class="drawer-head">
        <div class="drawer-head-txt">
            <div class="drawer-title" id="w-drawer-title"></div>
            <div class="drawer-path" id="w-drawer-path"></div>
        </div>
        <button class="drawer-x" id="w-drawer-x" title="关闭">×</button>
    </div>
    <div class="drawer-body t-scroll" id="w-drawer-body"></div>
    <div class="drawer-foot" id="w-drawer-foot"></div>
</aside>

<script>
    window.RAG_URLS = {
        ask: "{% url 'rag:ask_stream' %}",
        feedback: "{% url 'rag:feedback' %}"
    };
</script>
<script src="{% static 'rag/js/ask.js' %}"></script>
</body>
</html>
