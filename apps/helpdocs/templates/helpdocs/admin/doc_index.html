<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帮助中心 · 文档管理</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 40px 20px;
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f5f7fa; color: #1a1a2e;
        }
        .wrap { max-width: 560px; margin: 0 auto; }
        .card {
            background: #fff; border: 1px solid #e5e9f0; border-radius: 12px;
            padding: 26px 24px; margin-bottom: 16px;
        }
        h1 { font-size: 20px; margin: 0 0 6px; }
        .sub { font-size: 13px; color: #8a97a8; margin: 0 0 20px; }
        label { display: block; font-size: 13px; color: #5f6b7a; margin: 0 0 6px; }
        input[type=text] {
            width: 100%; padding: 9px 12px; font-size: 14px;
            border: 1px solid #d8e0ea; border-radius: 8px; margin-bottom: 14px;
            font-family: inherit;
        }
        input[type=text]:focus { outline: none; border-color: #2b7de9; }
        button {
            padding: 9px 18px; font-size: 14px; border: 1px solid #2b7de9;
            background: #2b7de9; color: #fff; border-radius: 8px; cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #1f6bd0; }
        button.ghost { background: #fff; color: #2b7de9; }
        button.ghost:hover { background: #f0f5fd; }
        .msg {
            padding: 10px 14px; border-radius: 8px; font-size: 13px;
            background: #fdecea; color: #c0392b; margin-bottom: 16px;
        }
        .back { font-size: 13px; display: inline-block; margin-top: 4px; color: #8a97a8; text-decoration: none; }
        .back:hover { color: #2b7de9; }
    </style>
</head>
<body>
<div class="wrap">

    <div class="card">
        <h1>编辑已有文档</h1>
        <p class="sub">输入文档 ID（docid），读取它的原始 HTML 进行编辑。</p>

        {% if message %}<div class="msg">{{ message }}</div>{% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="docid">文档 ID</label>
            <input type="text" id="docid" name="docid" placeholder="例如 1" autocomplete="off" autofocus>
            <button type="submit">打开并编辑</button>
        </form>
    </div>

    <div class="card">
        <h1>新建文档</h1>
        <p class="sub">创建一个空白文档，创建后直接进入编辑页，页面上会显示它的 docid。</p>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="create">
            <label for="title">标题（可留空，之后再改）</label>
            <input type="text" id="title" name="title" placeholder="例如 快速开始" autocomplete="off">
            <button type="submit" class="ghost">新建一篇</button>
        </form>
    </div>

    <a class="back" href="/suadmin/">← 返回后台首页</a>
</div>
</body>
</html>
