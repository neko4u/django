<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问受限 - 403</title>
    <!-- 引入 FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: "Microsoft YaHei", sans-serif;
            color: #2d3436;
        }

        .error-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box {
            font-size: 80px;
            color: #ff7675;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #d63031;
        }

        p.error-msg {
            font-size: 18px;
            margin-bottom: 30px;
            color: #636e72;
            line-height: 1.6;
        }

        .redirect-text {
            font-size: 14px;
            color: #b2bec3;
        }

        #countdown {
            font-weight: bold;
            color: #0984e3;
            font-size: 16px;
        }

        .home-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #0984e3;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: background 0.3s;
        }

        .home-btn:hover {
            background-color: #74b9ff;
        }
    </style>
</head>
<body>

<div class="error-container">
    <div class="icon-box">
        <i class="fas fa-shield-halved"></i>
    </div>
    <h1>访问权限受限</h1>
    <!-- 这里显示视图传过来的错误信息 -->
    <p class="error-msg">{{ error|default:"您没有权限访问此页面" }}</p>
    
    <div class="redirect-text">
        页面将在 <span id="countdown">5</span> 秒后自动跳转至首页
    </div>
    
    <a href="{% url 'index' %}" class="home-btn">立即返回首页</a>
</div>

<script>
    let seconds = 5;
    const countdownEl = document.getElementById('countdown');

    // 倒计时逻辑
    const timer = setInterval(() => {
        seconds--;
        countdownEl.innerText = seconds;

        if (seconds <= 0) {
            clearInterval(timer);
            // 倒计时结束，重定向到 index
            window.location.href = "{% url 'index' %}";
        }
    }, 1000);
</script>

</body>
</html>
