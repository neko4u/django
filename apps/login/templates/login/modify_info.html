{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modify</title>
    <link rel="stylesheet" href="{% static 'login/css/modify_info.css' %}">
    <link rel="stylesheet" href="{% static 'captcha/css/slider.css' %}">
    <script src="{% static 'captcha/js/slider.js' %}" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.9/cropper.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.9/cropper.min.css"/>
    <!-- <script src="{% static 'login/js/index.js' %}" defer></script> -->
</head>
<script>
    function handlePageLoad() {
    const loader = document.getElementById('page-loader');

    loader.classList.add('hidden');
    
    setTimeout(() => {
        loader.style.display = 'none';
    }, 500); 
    }

    document.onreadystatechange = function() {
    if (document.readyState === 'interactive') {
    }
    
    if (document.readyState === 'complete') {
        handlePageLoad();
    }
    };

    window.onload = handlePageLoad;

    window.addEventListener('error', function(e) {
    const loader = document.getElementById('page-loader');
    loader.innerHTML = `
        <div class="loader-container">
        <div class="loader-error">⚠️</div>
        <div class="loader-text">页面加载失败</div>
        <button id="reload-button" class="loader-button">重新加载</button>
        </div>
    `;
    
    document.getElementById('reload-button').addEventListener('click', function() {
        location.reload();
    });
    }, true);

    setTimeout(() => {
    const loader = document.getElementById('page-loader');
    if (loader && loader.style.display !== 'none') {
        document.querySelector('.loader-text').textContent = '正在努力加载，可能需要更长时间...';
    }
    }, 5000);
</script>
<body>
    <div id="page-loader">
        <div class="loader-container">
            <div class="loader-spinner"></div>
            <div class="loader-text">加载中，请稍候...</div>
        </div>
    </div>
    <div class="mask" id="mask" style="height: 100%;width: 100%;background-color: #666666b7;z-index: 2005;position: fixed;display: none;">
    </div>
    {% if messages %}
    <div style="position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:2600;width:min(420px,92vw);">
        {% for message in messages %}
        <div style="padding:11px 14px;border-radius:8px;margin-bottom:10px;font-size:0.88rem;
                    {% if message.tags == 'success' %}background:#e8f7ee;color:#146c2e;border:1px solid #bfe6cd;
                    {% else %}background:#fdecea;color:#b3261e;border:1px solid #f5c6c2;{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="modify-container">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="modify-avatar-container">
                <img 
                src="{% if request.session.info.avatar %}{{ request.session.info.avatar }}{% else %}{% static 'media/images/default.jpeg' %}{% endif %}"
                alt="用户头像" 
                class="modify-user-avatar"
                id="modify-user-avatar-img"
                onclick="ModifyAvatar(event)">

                <input
                type="file" 
                name="avatar" 
                id="avatarInput" 
                accept="image/jpeg, image/png, image/jpg"
                style="display: none;">
            </div>
            <!--  -->
            <div class="avatar-modify-panel" id="avatar-modify-panel" style="background-color: #ffffff;display: none;">
                <div class="avatar-container" id="avatar-container">
                    <img id="avatar" class="avatarPre">
                </div>
                <div class="avatar-controls" style="margin-left: auto;margin-right: auto;">
                    <button type="button" class="btn-confirm" onclick="handleConfirmClick(event)">保存</button>
                    <button type="button" class="btn-cancel" onclick="handleCancelClick(event)">取消</button>
                </div>
            </div>
            <!--  -->
            <style>
                /* 核心容器样式 */
                .avatar-modify-panel {
                    text-align: center;
                    position: fixed;
                    top: 20%;
                    left: 25%;
                    width: 50%;
                    height: 60%;
                    z-index: 2010;
                    display: none;
                }
                                
                .avatar-container {
                    display: inline-block;
                    top: 2%;
                    margin: 0 auto;
                    z-index: 10002;
                    width: 90%;
                    height: 90%;
                }

                .avatarPre {
                    margin: 0 auto;
                    z-index: 2020;
                    /* 864*496 */
                }

                
                .avatar-controls {
                    display: flex;
                    justify-content: center;
                    background: #fff;
                    z-index: 2100; /* 确保按钮在最顶层 */
                }
                .avatar-container {
                    position: relative !important;
                    overflow: hidden !important;
                }

                /* 按钮样式 */
                .btn-confirm, .btn-cancel {
                    width: 84px;
                    padding: 10px 26px;
                    margin: 14px;
                    border: none;
                    border-radius: 6px;
                    cursor: pointer;
                    font-weight: 500;
                    transition: all 0.2s;
                }
                
                .btn-confirm {
                    background: #2196F3;
                    color: white;
                }
                
                .btn-confirm:hover {
                    background: #1976D2;
                    transform: translateY(-1px);
                }
                
                .btn-cancel {
                    background: #666;
                    color: white;
                }
                
                .btn-cancel:hover {
                    background: #444;
                    transform: translateY(-1px);
                }
                </style>
                
                <script>
                let cropper = null;
                function getCookie(name) {
                    let cookieValue = null;
                    if (document.cookie && document.cookie !== '') {
                        const cookies = document.cookie.split(';');
                        for (let i = 0; i < cookies.length; i++) {
                            const cookie = cookies[i].trim();
                            // 检查 cookie 名称是否匹配
                            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                                break;
                            }
                        }
                    }
                    return cookieValue;
                }

                function ModifyAvatar(e){
                    document.getElementById("avatarInput").click();
                }

                function handleCancelClick(e){
                    var mask = document.getElementById("mask");
                    var modify_panel = document.getElementById("avatar-modify-panel");
                    mask.style.display = "none";
                    modify_panel.style.display = "none";
                }

                function handleConfirmClick(e){
                    if(!cropper) return;
                    const csrftoken = getCookie("csrftoken");
                    const canvas = cropper.getCroppedCanvas({
                        width: 300,
                        height: 300,
                    })
                    canvas.toBlob(async (blob) => {
                        try {
                            const formData = new FormData();
                            formData.append('avatar', blob);
                            fetch('/uploadAvatar/',{
                                method: 'POST',
                                body: formData,
                                headers: {
                                    'X-CSRFToken': csrftoken
                                }
                            })
                            .then(response => {
                                return response.json(); // 确保解析响应
                            })
                            .then(data => {
                                const imgTemp = new Image();
                                imgTemp.onload = function() {
                                    document.getElementById("modify-user-avatar-img").src = data.url;
                                };
                                imgTemp.src = data.url;
                                console.log(data);
                                console.log('{{ request.session.info.avatar }}');
                            })
                            .catch(error => {
                                console.error('上传失败:', error);
                            });
                        }
                        catch (error){
                            return;
                        }
                    });
                    var mask = document.getElementById("mask");
                    var modify_panel = document.getElementById("avatar-modify-panel");
                    mask.style.display = "none";
                    modify_panel.style.display = "none";
                }



                document.getElementById("avatarInput").addEventListener('change',function(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    let MAX_WIDTH = 864;
                    let MAX_HEIGHT = 496;
                    const QUALITY = 0.6;
                    var mask = document.getElementById("mask");
                    var modify_panel = document.getElementById("avatar-modify-panel");
                    mask.style.display = "block";
                    modify_panel.style.display = "block";

                    let reader = new FileReader();
                    reader.onload = function(e){
                        const image = document.getElementById("avatar");
                        const preview = document.getElementById("avatar");

                        if (cropper){
                            cropper.destroy();
                            cropper = null;
                        }

                        const tempImage = new Image();
                        tempImage.onload = function() {
                            const width = this.naturalWidth;
                            const height = this.naturalHeight;
                            let ratio = 1;
                            var temp1 = document.getElementById("avatar-container").getBoundingClientRect();
                            MAX_WIDTH = temp1.width;
                            MAX_HEIGHT = temp1.height;
                            if (width > MAX_WIDTH || height > MAX_HEIGHT) {
                                ratio = Math.min(MAX_WIDTH / width, MAX_HEIGHT / height);
                            }   
                            const canvas = document.createElement('canvas');
                            canvas.width = width * ratio;
                            canvas.height = height * ratio;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(
                                this,
                                0, 0, width, height,       // 原始图像区域
                                0, 0, canvas.width, canvas.height       // Canvas 绘制区域
                            );
                            image.src = canvas.toDataURL('image/jpeg', 0.8);
                            cropper = new Cropper(image,{
                                aspectRatio: 16 / 16,
                                viewMode: 0,
                                minContainerWidth: 100,
                                minContainerHeight: 100,
                                dragMode: 'move',
                            });
                        };
                        tempImage.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });



                function validateName(name) {
                    if (!name) return "昵称不能为空";
                    if (!/^[A-Za-z0-9]{4,16}$/.test(name)) {
                        return "昵称请填写为用英文与数字形式4-16位";
                    }
                    return null;
                }

                function validateEmail(email) {
                    if (!email) return "邮箱不能为空";
                    if (!/^[a-zA-Z0-9_.+-]+@[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(\.[a-zA-Z]{2,})?$/.test(email)) {
                        return "请填写正确的邮箱格式";
                    }
                    return null;
                }

                function validatePhone(phone) {
                    if (!phone) return "手机号不能为空";
                    if (!/^1[3-9]\d{9}$/.test(phone)) {
                        return "手机号码格式错误";
                    }
                    return null;
                }

                function showError(fieldId, message) {
                    const errorElement = document.getElementById(fieldId);
                    if (message) {
                        errorElement.textContent = message;
                        errorElement.style.display = 'block';
                    } else {
                        errorElement.style.display = 'none';
                    }
                }

                document.addEventListener('DOMContentLoaded', function() {
                    const nameInput = document.querySelector('input[name="name"]');
                    if (nameInput) {
                        nameInput.addEventListener('input', function() {
                            const error = validateName(this.value);
                            showError('name-error', error);
                        });
                        
                        nameInput.addEventListener('blur', function() {
                            const error = validateName(this.value);
                            showError('name-error', error);
                        });
                    }

                    const emailInput = document.querySelector('input[name="email"]');
                    if (emailInput) {
                        emailInput.addEventListener('input', function() {
                            const error = validateEmail(this.value);
                            showError('email-error', error);
                        });
                        
                        emailInput.addEventListener('blur', function() {
                            const error = validateEmail(this.value);
                            showError('email-error', error);
                        });
                    }

                    const phoneInput = document.querySelector('input[name="phone"]');
                    if (phoneInput) {
                        phoneInput.addEventListener('input', function() {
                            const error = validatePhone(this.value);
                            showError('phone-error', error);
                        });
                        
                        phoneInput.addEventListener('blur', function() {
                            const error = validatePhone(this.value);
                            showError('phone-error', error);
                        });
                    }
                });

            document.querySelector('form').addEventListener('submit', function(e) {
                let hasError = false;
                
                const nameError = validateName(document.querySelector('input[name="name"]').value);
                const emailError = validateEmail(document.querySelector('input[name="email"]').value);
                const phoneError = validatePhone(document.querySelector('input[name="phone"]').value);
                
                showError('name-error', nameError);
                showError('email-error', emailError);
                showError('phone-error', phoneError);
                
                if (nameError || emailError || phoneError) {
                    e.preventDefault();
                    hasError = true;
                }
                
                return !hasError;
            });


                </script>
            <!--  -->

            <div>
                <label style="user-select: none;">帐号</label>
                <input type="text" value="{{ form.instance.account }}" readonly disabled>
            </div>
            <div>
                <label style="user-select: none;">昵称</label>
                {{ form.name }}
            </div>
            <div>
                <label style="user-select: none;">邮箱</label>
                {{ form.email }}
            </div>
            <div>
                <label style="user-select: none;">手机</label>
                {{ form.phone }}
            </div>
            <input type="hidden" id="originalEmail" value="{{ account_email }}">

            {% if is_frp %}
            <div id="emailCodeBox" style="display:none;">
                <div style="display:block;width:100%;">
                    <div style="display:block;font-size:13px;line-height:1.6;color:#5f6b7a;background:#f5f8ff;
                                border:1px solid #d0d7e2;border-radius:8px;padding:9px 11px;">
                        你正在修改注册邮箱。为确认是本人操作，验证码会发送到
                        <b>当前邮箱 {{ masked_email }}</b>，验证通过后才能保存。
                    </div>
                    <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
                        <input type="text" id="emailCodeInput" maxlength="8" inputmode="numeric"
                               autocomplete="off" placeholder="6位验证码" style="flex:1;min-width:0;">
                        <button type="button" id="sendEmailCodeBtn"
                                style="white-space:nowrap;padding:0 14px;height:38px;border:1px solid #d0d7e2;
                                       background:#fff;color:#2b7de9;border-radius:8px;font-size:0.86rem;cursor:pointer;">
                            获取验证码
                        </button>
                    </div>
                    <button type="button" id="verifyEmailCodeBtn" disabled
                            style="width:100%;margin-top:8px;padding:9px 0;border:1px solid #d0d7e2;
                                   background:#fff;color:#9aa7b6;border-radius:8px;font-size:0.86rem;cursor:not-allowed;">
                        验证验证码
                    </button>
                    <div id="emailCodeMsg"
                         style="display:block;min-height:17px;margin-top:6px;font-size:0.82rem;color:#5f6b7a;"></div>
                </div>
            </div>

            <div style="display:block;width:100%;margin-top:6px;">
                <div id="sliderBox"></div>
            </div>
            <input type="hidden" name="slider_ticket" id="sliderTicket" value="">
            <input type="hidden" name="email_ticket" id="emailTicket" value="">

            <button type="submit" id="saveBtn" disabled>请先完成安全验证</button>
            {% else %}
            <button type="submit" id="saveBtn">保存</button>
            {% endif %}

            <div style="width: 100%;display: table;">
                <div id="name-error" class="error-message" style="color: red; font-size: 16px; text-align: center; display: none;"></div>
                <div id="email-error" class="error-message" style="color: red; font-size: 16px; text-align: center; display: none;"></div>
                <div id="phone-error" class="error-message" style="color: red; font-size: 16px; text-align: center; display: none;"></div>
            </div>

            <div style="justify-content: center;margin-top: 1rem;">
                <a href="{{ home_url }}" style="color: rgb(28, 99, 156);">返回主页</a>
            </div>
        </form>
    </div>
    <script>
        (function () {
            'use strict';
        
            var IS_FRP = {% if is_frp %}true{% else %}false{% endif %};
            if (!IS_FRP) { return; }
        
            var SEND_URL = '/api/send-email-code/';
            var VERIFY_URL = '/api/verify-email-code/';
        
            function getCookie(name) {
                var m = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
                return m ? decodeURIComponent(m[2]) : '';
            }
        
            function post(url, data) {
                var body = new URLSearchParams();
                Object.keys(data).forEach(function (k) { body.append(k, data[k]); });
                return fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                        'X-Requested-With': 'XMLHttpRequest',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'same-origin',
                    body: body.toString()
                }).then(function (r) { return r.json(); });
            }
        
            var form = document.querySelector('form');
            var saveBtn = document.getElementById('saveBtn');
            var sliderTicket = document.getElementById('sliderTicket');
            var emailTicket = document.getElementById('emailTicket');
            var emailInput = document.querySelector('input[name="email"]');
            var originalEmailInput = document.getElementById('originalEmail');
            var originalEmail = originalEmailInput ? originalEmailInput.value : '';
            var codeBox = document.getElementById('emailCodeBox');
            var codeInput = document.getElementById('emailCodeInput');
            var codeMsg = document.getElementById('emailCodeMsg');
            var sendBtn = document.getElementById('sendEmailCodeBtn');
            var verifyBtn = document.getElementById('verifyEmailCodeBtn');
        
            var sliderOk = false;
            var emailOk = false;
        
            function emailChanged() {
                if (!emailInput) return false;
                return emailInput.value.trim().toLowerCase() !== originalEmail.trim().toLowerCase();
            }
        
            function setCodeMsg(text, color) {
                codeMsg.textContent = text || '';
                codeMsg.style.color = color || '#5f6b7a';
            }
        
            function refresh() {
                var changed = emailChanged();
                if (codeBox) codeBox.style.display = changed ? 'block' : 'none';
        
                if (!changed) {
                    emailOk = false;
                    if (emailTicket) emailTicket.value = '';
                }
        
                var ready = sliderOk && (!changed || emailOk);
                saveBtn.disabled = !ready;
                if (ready) {
                    saveBtn.innerText = '保存';
                } else if (!sliderOk) {
                    saveBtn.innerText = '请先完成安全验证';
                } else {
                    saveBtn.innerText = '请先完成邮箱验证';
                }
            }
        
            // 滑块
            if (window.SliderCaptcha) {
                SliderCaptcha.mount('#sliderBox', {
                    onSuccess: function (ticket) {
                        sliderTicket.value = ticket;
                        sliderOk = true;
                        refresh();
                    },
                    onFail: function () {
                        sliderTicket.value = '';
                        sliderOk = false;
                        refresh();
                    }
                });
            }
        
            // 改邮箱时才出现验证码区
            if (emailInput) {
                emailInput.addEventListener('input', refresh);
                emailInput.addEventListener('blur', refresh);
            }
        
            // 发送验证码（服务端固定发到"旧邮箱"，不看前端传的邮箱）
            sendBtn.addEventListener('click', function () {
                if (!emailChanged()) return;
                sendBtn.disabled = true;
                sendBtn.innerText = '发送中...';
                setCodeMsg('', '');
        
                post(SEND_URL, { email: originalEmail, scene: 'change_email' })
                    .then(function (data) {
                        if (data.success) {
                            setCodeMsg(data.message || '验证码已发送', '#22c55e');
                            var left = 60;
                            sendBtn.innerText = left + 's';
                            var timer = setInterval(function () {
                                left -= 1;
                                if (left <= 0) {
                                    clearInterval(timer);
                                    sendBtn.disabled = false;
                                    sendBtn.innerText = '重新获取';
                                    return;
                                }
                                sendBtn.innerText = left + 's';
                            }, 1000);
                        } else {
                            setCodeMsg(data.message || '发送失败', '#e5534b');
                            sendBtn.disabled = false;
                            sendBtn.innerText = '获取验证码';
                        }
                    })
                    .catch(function () {
                        setCodeMsg('网络错误，请稍后重试', '#e5534b');
                        sendBtn.disabled = false;
                        sendBtn.innerText = '获取验证码';
                    });
            });
        
            // 校验验证码
            codeInput.addEventListener('input', function () {
                var ok = this.value.trim().length >= 4;
                verifyBtn.disabled = !ok;
                verifyBtn.style.color = ok ? '#2b7de9' : '#9aa7b6';
                verifyBtn.style.cursor = ok ? 'pointer' : 'not-allowed';
            });
        
            verifyBtn.addEventListener('click', function () {
                var code = codeInput.value.trim();
                if (!code) return;
                verifyBtn.disabled = true;
                verifyBtn.innerText = '验证中...';
                setCodeMsg('', '');
        
                post(VERIFY_URL, { email: originalEmail, code: code, scene: 'change_email' })
                    .then(function (data) {
                        verifyBtn.innerText = '验证验证码';
                        if (data.success && data.ticket) {
                            emailTicket.value = data.ticket;
                            emailOk = true;
                            codeInput.disabled = true;
                            setCodeMsg('邮箱验证通过', '#22c55e');
                            refresh();
                        } else {
                            setCodeMsg(data.message || '验证码错误或已过期', '#e5534b');
                            verifyBtn.disabled = false;
                        }
                    })
                    .catch(function () {
                        verifyBtn.innerText = '验证验证码';
                        verifyBtn.disabled = false;
                        setCodeMsg('网络错误，请稍后重试', '#e5534b');
                    });
            });
        
            // 兜底：即使按钮被绕过（如回车提交），也不允许未验证就提交
            form.addEventListener('submit', function (e) {
                if (!sliderOk || (emailChanged() && !emailOk)) {
                    e.preventDefault();
                    refresh();
                    return false;
                }
            });
        
            refresh();
        }());
        </script>
        
</body>
</html>
